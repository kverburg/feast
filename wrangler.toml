name = "feast"
compatibility_date = "2025-01-01"

# Only reachable via your domain (so Cloudflare Access always applies)
workers_dev = false
preview_urls = false
routes = [{ pattern = "feast.kmverburg.nl", custom_domain = true }]

# Static Vite build output; unknown paths fall back to index.html (SPA)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
