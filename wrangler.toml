name = "feast"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# No public workers.dev address. Preview URLs (per-PR test versions) stay on,
# protected by the Worker Access policy ("production and previews") and the worker's own header check.
workers_dev = false
preview_urls = true
routes = [{ pattern = "feast.kmverburg.nl", custom_domain = true }]

# Static Vite build output; unknown paths fall back to index.html (SPA).
# /api/* must hit the worker first, otherwise the SPA fallback would answer it.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "FEAST"
id = "41829805173244e9a8a5290c07dd772b"
