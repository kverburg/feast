# Used by CI to upload a per-PR test version of the same worker (never deployed to production).
# Identical to wrangler.toml except it binds a separate KV namespace, so test data never touches real recipes.
name = "feast"
main = "worker/index.js"
compatibility_date = "2025-01-01"

workers_dev = false
preview_urls = true

# Workers Logs: every request and console.log line is searchable in the dashboard (7 days)
# Gemini models (the key itself is the GEMINI_API_KEY secret, never in this file)
[vars]
GEMINI_MODEL = "gemini-flash-latest"
GEMINI_MODEL_LIGHT = "gemini-flash-lite-latest"
# Background work uses the Gemini batch API ("off" = direct calls). GEMINI_MODEL_BATCH can force a batch model.
GEMINI_BATCH = "on"
# Previews have no cron: while the app is open, polling moves background work along instead
PUMP_ON_POLL = "true"

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "FEAST"
id = "610879616dd24899a76d4ec3398766a4"
